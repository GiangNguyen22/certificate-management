spring.application.name=certificate-management

# Default: use MySQL for local development. If you want H2 instead, comment the MySQL block and
# uncomment the H2 block below or use a Spring profile.
spring.datasource.url=jdbc:mysql://localhost:3306/Cert_Management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA (MySQL)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# application.properties
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Kích thước tối đa cho MỘT tệp (file) được tải lên
spring.servlet.multipart.max-file-size=10MB

# Kích thước tối đa cho TỔNG YÊU CẦU (request) Multipart, bao gồm tất cả các tệp và dữ liệu form
spring.servlet.multipart.max-request-size=10MB