spring.application.name=certificate_management

# MySQL Data Source Configuration
spring.datasource.url = jdbc:mysql://localhost:3306/certificate_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=giang1234@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA (MySQL)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# application.properties
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Kích thước tối đa cho MỘT tệp (file) được tải lên
spring.servlet.multipart.max-file-size=10MB

# Kích thước tối đa cho TỔNG YÊU CẦU (request) Multipart, bao gồm tất cả các tệp và dữ liệu form
spring.servlet.multipart.max-request-size=10MB