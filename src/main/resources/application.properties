spring.application.name=certificate-management

# Default: use MySQL for local development. If you want H2 instead, comment the MySQL block and
# uncomment the H2 block below or use a Spring profile.
spring.datasource.url=jdbc:mysql://localhost:3309/Cert_Management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=mySecretKeyThatShouldBeAtLeast256BitsLongForHS256AlgorithmAndShouldBeChangedInProductionEnvironment
jwt.access-token.expiration=900000
jwt.refresh-token.expiration=604800000

# Hibernate / JPA (MySQL)
debug=true
spring.mvc.log-request-details=true
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# application.properties
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

